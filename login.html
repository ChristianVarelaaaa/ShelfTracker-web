<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfTracker - Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginPage">
    <div class="login-box">
      <h2>ShelfTracker</h2>
      <p style="text-align:center; color:#64748b; margin-bottom:1.5rem; font-size:16px;">Admin portal — sign in to continue.</p>

      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Sign In</button>

      <p style="text-align:center; margin-top:1.2rem; font-size:15px; color:#64748b;">
        No account? <a href="signup.html" style="color:#0f766e; font-weight:600; text-decoration:none;">Create one</a>
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
