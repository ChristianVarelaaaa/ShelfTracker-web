<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfTracker - Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginPage">
    <div class="login-box">
      <h2>Admin Portal</h2>
      <input type="text" id="username" placeholder="Admin Username">
      <input type="password" id="password" placeholder="Admin Password">
      <button onclick="login()">Login as Admin</button>
      
      <div style="margin-top: 1rem; text-align: center;">
        <a href="index.html" style="color: var(--sidebar); font-size: 0.9rem; font-weight: 600; text-decoration: none;">← Back to Dashboard</a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
