<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfTracker - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginPage">
    <div class="login-box">
      <h2>ShelfTracker</h2>
      <p style="text-align:center; color:#64748b; margin-bottom:1.5rem; font-size:16px;">Register a new admin account.</p>

      <input type="text" id="newUsername" placeholder="Create a username">
      <input type="password" id="newPassword" placeholder="Create a password">
      <button onclick="registerAccount()">Create Account</button>

      <p style="text-align:center; margin-top:1.2rem; font-size:15px; color:#64748b;">
        Already have an account? <a href="login.html" style="color:#0f766e; font-weight:600; text-decoration:none;">Sign in</a>
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
